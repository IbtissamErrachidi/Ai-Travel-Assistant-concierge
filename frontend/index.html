<!DOCTYPE html>
<html lang="fr" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Assistant — Conciergerie Voyage</title>
    <meta name="description"
        content="Votre conciergerie aérienne intelligente Royal Air Maroc pour un accompagnement voyage sur mesure.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ram: {
                            burgundy: '#8B1538',
                            burgundyDark: '#6A102A',
                            gold: '#D4AF37',
                            offwhite: '#FAF8F5',
                            light: '#F3F4F6',
                            dark: '#111111',
                            charcoal: '#2D2D2D'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAF8F5;
            color: #111111;
        }

        .gold-border {
            border-color: rgba(212, 175, 55, 0.3);
        }

        .burgundy-gradient {
            background: linear-gradient(135deg, #8B1538 0%, #5E0E25 100%);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.3s ease forwards;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .streaming-cursor::after {
            content: '▍';
            display: inline-block;
            animation: blink 0.7s step-start infinite;
            color: #8B1538;
            margin-left: 1px;
            font-size: 0.85em;
            vertical-align: text-bottom;
        }

        @keyframes phrasePulse {
            0% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.4;
            }
        }

        .loading-phrase {
            animation: phrasePulse 1.8s ease-in-out infinite;
        }

        /* ── Wave animation for voice recording ── */
        @keyframes soundWave {

            0%,
            100% {
                height: 6px;
            }

            50% {
                height: 24px;
            }
        }

        .wave-bar-1 {
            animation: soundWave 0.8s ease-in-out infinite;
        }

        .wave-bar-2 {
            animation: soundWave 1.1s ease-in-out infinite 0.2s;
        }

        .wave-bar-3 {
            animation: soundWave 0.7s ease-in-out infinite 0.4s;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.2);
            border-radius: 4px;
        }

        .chat-bubble-user {
            background: linear-gradient(135deg, #8B1538, #5E0E25);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }

        .chat-bubble-ai {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 4px 18px 18px 18px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .dark .chat-bubble-ai {
            background: #1f2937;
            border-color: #374151;
        }

        .source-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 9999px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .source-rag {
            background: #fef3c7;
            color: #92400e;
        }

        .source-tool {
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>

<body class="h-full overflow-hidden flex flex-col">

    <!-- TOP BAR -->
    <div
        class="bg-ram-burgundy text-ram-offwhite text-xs py-1.5 px-6 flex justify-between items-center z-30 font-medium shrink-0">
        <span>Service Conciergerie &amp; Support Voyageurs</span>
        <div class="hidden sm:flex items-center space-x-6 text-[11px]">
            <span class="cursor-pointer hover:text-ram-gold transition">Support VIP</span>
            <span class="cursor-pointer hover:text-ram-gold transition">Assistance Bagages</span>
        </div>
    </div>

    <!-- APP ROOT -->
    <div id="app-root" class="flex-1 flex overflow-hidden relative"></div>

    <!-- ERROR TOAST -->
    <div id="error-toast"
        class="hidden fixed bottom-6 right-6 z-50 bg-red-600 text-white text-xs px-5 py-3 rounded-2xl shadow-xl max-w-xs fade-in">
        <span id="error-toast-msg"></span>
    </div>

    <script>
        const API = '';
        const LOADING_PHRASES = [
            "Recherche des informations en cours...",
            "Consultation des disponibilités...",
            "Préparation de votre réponse...",
            "Vérification des informations de voyage...",
            "Recherche des détails de votre vol...",
            "Consultation des conditions de voyage...",
            "Finalisation de votre réponse...",
        ];

        const state = {
            screen: 'login',
            dark: false,
            lang: 'fr',
            token: localStorage.getItem('ta_token') || null,
            user: JSON.parse(localStorage.getItem('ta_user') || 'null'),
            sessionId: localStorage.getItem('ta_session') || null,
            messages: [],
            history: [],
            isLoading: false,
            loginError: '',
            loadingPhrase: LOADING_PHRASES[0],
            phraseTimer: null,
        };

        if (state.token && state.user) {
            state.screen = 'dashboard';
            fetchHistory();
        }

        function render() {
            const root = document.getElementById('app-root');
            root.className = `flex-1 flex overflow-hidden relative ${state.dark ? 'dark bg-ram-dark text-ram-offwhite' : 'bg-ram-offwhite text-ram-dark'}`;
            root.innerHTML = state.screen === 'login' ? renderLogin() : renderDashboard();
            lucide.createIcons();
            if (state.screen === 'dashboard') {
                scrollToBottom();
                const inp = document.getElementById('chat-input');
                if (inp && !state.isLoading) inp.focus();
            }
        }

        function renderLogin() {
            return `
        <div class="flex-1 flex flex-col lg:flex-row overflow-y-auto w-full">
            <div class="lg:w-1/2 burgundy-gradient p-12 lg:p-24 flex flex-col justify-between text-white relative">
                <div class="space-y-4">
                    <span class="text-xs uppercase tracking-widest text-ram-gold font-semibold">Espace Privilège</span>
                    <h1 class="text-4xl lg:text-6xl font-serif font-bold tracking-tight">AI Travel<br>Assistant</h1>
                    <p class="text-sm text-gray-300 max-w-sm font-light">Votre conciergerie aérienne intelligente pour un accompagnement sur mesure.</p>
                </div>
                <div class="space-y-3 my-8">
                    ${[['zap', 'Réponses en temps réel'], ['shield', 'Contexte conversationnel persistant'], ['search', 'Vols, réservations et conditions de voyage']].map(([ic, txt]) => `
                    <div class="flex items-center space-x-3 text-sm text-white/80">
                        <div class="w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center shrink-0"><i data-lucide="${ic}" class="w-4 h-4 text-ram-gold"></i></div>
                        <span>${txt}</span>
                    </div>`).join('')}
                </div>
                <div class="text-xs text-gray-400">Royal Air Maroc — Service Numérique</div>
            </div>
            <div class="lg:w-1/2 p-8 lg:p-24 flex items-center justify-center bg-white dark:bg-ram-charcoal">
                <div class="max-w-md w-full space-y-6">
                    <div><h2 class="text-2xl font-serif font-bold text-ram-burgundy dark:text-ram-gold">Connexion</h2>
                    <p class="text-xs text-gray-500 mt-1">Veuillez entrer vos identifiants.</p></div>
                    ${state.loginError ? `<div class="px-4 py-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl">${state.loginError}</div>` : ''}
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Email</label>
                            <input id="login-email" type="email" value="ibtissam.errachidi@travel.ai"
                                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:ring-2 focus:ring-ram-burgundy/30"
                                onkeydown="if(event.key==='Enter') handleLogin()">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Mot de passe</label>
                            <input id="login-password" type="password" value="demo1234"
                                class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-sm outline-none focus:ring-2 focus:ring-ram-burgundy/30"
                                onkeydown="if(event.key==='Enter') handleLogin()">
                        </div>
                        <button id="login-btn" onclick="handleLogin()"
                            class="w-full py-3.5 burgundy-gradient text-white font-semibold rounded-xl text-xs uppercase tracking-wider shadow-lg transition hover:opacity-95 flex items-center justify-center">
                            <span id="login-btn-label">Se connecter</span>
                        </button>
                        <p class="text-center text-[11px] text-gray-400">Démo : ibtissam.errachidi@travel.ai / demo1234</p>
                    </div>
                </div>
            </div>
        </div>`;
        }

        function renderDashboard() {
            const firstName = (state.user?.name || 'Voyageur').split(' ')[0];
            return `
        <div class="flex h-full w-full overflow-hidden">
            <aside class="w-72 bg-white dark:bg-ram-charcoal border-r border-gray-200 dark:border-gray-800 flex flex-col justify-between shrink-0">
                <div class="p-4 space-y-4 flex flex-col overflow-hidden">
                    <div class="flex items-center space-x-3 px-2 py-1">
                        <div class="w-8 h-8 rounded-xl burgundy-gradient text-white flex items-center justify-center font-serif font-bold text-xs shrink-0">TA</div>
                        <h2 class="font-serif font-bold text-sm text-ram-burgundy dark:text-ram-gold">Travel Assistant</h2>
                    </div>
                    <button onclick="startNewChat()" class="w-full py-2.5 px-4 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 font-semibold rounded-xl text-xs flex items-center justify-center space-x-2 transition">
                        <i data-lucide="plus" class="w-4 h-4"></i><span>Nouvelle conversation</span>
                    </button>
                    <div class="space-y-1 flex-1 overflow-hidden flex flex-col">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 px-2">Historique récent</span>
                        <div class="flex-1 overflow-y-auto space-y-0.5 pr-1 max-h-56">
                            ${state.history.length === 0
                    ? `<p class="text-[11px] text-gray-400 px-3 py-2">Aucune conversation précédente.</p>`
                    : state.history.map(h => `
                                <div class="group flex items-center justify-between w-full rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition ${state.sessionId === h.session_id ? 'bg-ram-burgundy/5 text-ram-burgundy dark:text-ram-gold font-semibold' : 'text-gray-600 dark:text-gray-300'}">
                                    <button onclick="loadSession('${h.session_id}')"
                                        class="flex-1 text-left px-3 py-2 text-xs truncate">
                                        <span class="block truncate">${escHtml(h.title)}</span>
                                        <span class="text-[10px] text-gray-400">${h.date}</span>
                                    </button>
                                    <button onclick="deleteSession(event, '${h.session_id}')" 
                                        class="p-2 text-gray-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition shrink-0" title="Supprimer">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>`).join('')}
                        </div>
                    </div>
                    <div class="pt-1 space-y-0.5">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400 px-2">Suggestions</span>
                        ${["Statut du vol AH1235 aujourd'hui ?", "Politique bagages cabine ?", "Trouve-moi un vol Paris-Alger demain"].map(s => `
                        <button onclick="sendMsg('${s.replace(/'/g, "\\'")}')"
                            class="w-full text-left px-3 py-1.5 rounded-xl text-[11px] text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 truncate transition">
                            → ${s}
                        </button>`).join('')}
                    </div>
                </div>
                <div class="p-4 border-t border-gray-200 dark:border-gray-800 space-y-3 shrink-0">
                    <div class="flex items-center justify-between">
                        <div class="text-xs">
                            <p class="font-bold truncate max-w-[140px]">${escHtml(state.user?.name || '')}</p>
                            <p class="text-[10px] text-gray-400">Membre Vérifié</p>
                        </div>
                        <button onclick="toggleDark()" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500">
                            <i data-lucide="${state.dark ? 'sun' : 'moon'}" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="flex justify-between pt-1 text-xs text-gray-500">
                        <button onclick="handleLogout()" class="text-red-600 hover:underline">Déconnexion</button>
                        <select onchange="state.lang=this.value" class="text-[10px] bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg px-2 py-0.5 outline-none">
                            <option value="fr" ${state.lang === 'fr' ? 'selected' : ''}>FR</option>
                            <option value="en" ${state.lang === 'en' ? 'selected' : ''}>EN</option>
                            <option value="ar" ${state.lang === 'ar' ? 'selected' : ''}>AR</option>
                        </select>
                    </div>
                </div>
            </aside>
            <main class="flex-1 flex flex-col bg-ram-offwhite dark:bg-ram-dark overflow-hidden">
                <header class="h-14 border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-ram-charcoal/80 backdrop-blur px-6 flex items-center justify-between z-10 shrink-0">
                    <span class="font-serif font-bold text-sm text-ram-burgundy dark:text-ram-gold">Concierge Voyage</span>
                    <div class="flex items-center space-x-3">
                        ${state.sessionId ? `<span class="text-[10px] text-gray-400 font-mono">Session : ${state.sessionId.slice(0, 8)}…</span>` : ''}
                        <div class="flex items-center space-x-1.5">
                            <div class="w-2 h-2 rounded-full ${state.isLoading ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'}"></div>
                            <span class="text-[10px] text-gray-400">${state.isLoading ? 'En cours' : 'Prêt'}</span>
                        </div>
                    </div>
                </header>
                <div class="flex-1 overflow-y-auto p-6 space-y-5" id="chat-stream">
                    ${state.messages.length === 0 ? renderWelcome(firstName) : state.messages.map(renderMsg).join('')}
                    ${state.isLoading && !state.messages.some(m => m.streaming) ? renderLoadingCard() : ''}
                </div>

                <!-- INPUT FAÇON CHATGPT AVEC ONDES VOCALES -->
                <div class="p-4 bg-white dark:bg-ram-charcoal border-t border-gray-200 dark:border-gray-800 shrink-0">
                    <div class="max-w-3xl mx-auto relative flex items-center bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl px-4 py-2.5 shadow-sm transition">
                        
                        <!-- Zone de texte principale -->
                        <input type="text" id="chat-input"
                            placeholder="Posez votre question (ex : Statut du vol AH1235)..."
                            class="w-full bg-transparent text-sm outline-none text-gray-800 dark:text-gray-100 placeholder-gray-400 pr-28"
                            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleSend();}"
                            ${state.isLoading ? 'disabled' : ''}>

                        <!-- Conteneur des vagues (Caché par défaut, affiché pendant l'enregistrement) -->
                        <div id="voice-waves-container" class="hidden absolute inset-x-16 inset-y-0 flex items-center justify-center space-x-1.5 bg-gray-50 dark:bg-gray-800 rounded-2xl">
                            <span class="text-xs text-gray-400 mr-2 font-medium">Écoute en cours...</span>
                            <div class="w-1 bg-ram-burgundy rounded-full wave-bar-1"></div>
                            <div class="w-1 bg-ram-gold rounded-full wave-bar-2"></div>
                            <div class="w-1 bg-ram-burgundy rounded-full wave-bar-3"></div>
                            <div class="w-1 bg-ram-gold rounded-full wave-bar-1"></div>
                        </div>

                        <!-- Boutons normaux (Micro & Envoyer) -->
                        <div id="input-actions-normal" class="absolute right-3 flex items-center space-x-1.5">
                            <button onclick="startVoiceRecording()" class="p-2 text-gray-400 hover:text-ram-burgundy transition rounded-xl" title="Parler">
                                <i data-lucide="mic" class="w-4 h-4"></i>
                            </button>
                            <button onclick="handleSend()" class="p-2 burgundy-gradient text-white rounded-xl shadow-sm hover:opacity-90 transition disabled:opacity-40" title="Envoyer">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- Contrôles pendant l'enregistrement ou la transcription -->
                        <div id="input-actions-recording" class="hidden absolute right-3 flex items-center space-x-2">
                            <button onclick="cancelVoiceRecording()" class="p-2 text-gray-400 hover:text-red-600 transition rounded-xl" title="Annuler">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                            <button id="recording-action-btn" onclick="stopAndTranscribeVoice()" class="w-8 h-8 burgundy-gradient text-white rounded-xl flex items-center justify-center shadow-sm hover:opacity-90 transition" title="Arrêter l'enregistrement">
                                <i data-lucide="square" class="w-3.5 h-3.5 fill-current"></i>
                            </button>
                        </div>

                    </div>
                </div>
            </main>
        </div>`;
        }

        function renderWelcome(firstName) {
            return `
        <div class="max-w-xl mx-auto text-center space-y-6 py-16 fade-in">
            <div class="w-16 h-16 rounded-2xl burgundy-gradient text-white flex items-center justify-center mx-auto text-2xl font-serif font-bold shadow-lg">TA</div>
            <div>
                <h2 class="text-2xl font-serif font-bold text-ram-burgundy dark:text-ram-gold">Bonjour ${escHtml(firstName)},</h2>
                <p class="text-sm text-gray-500 mt-1">Comment puis-je vous assister pour vos déplacements aujourd'hui ?</p>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                ${[
                    ['zap', 'Statut d\'un vol', "Quel est le statut du vol AH1235 aujourd'hui ?"],
                    ['package', 'Bagages & règles', 'Combien de bagages puis-je prendre en cabine ?'],
                    ['search', 'Recherche de vol', 'Trouve-moi un vol Paris-Alger demain'],
                    ['help-circle', 'Droits passagers', 'Mon vol est annulé, puis-je être remboursé ?'],
                ].map(([ic, lbl, p]) => `
                <button onclick="sendMsg('${p.replace(/'/g, "\\'")}')"
                    class="px-4 py-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl text-xs font-medium hover:border-ram-burgundy hover:shadow-sm transition text-left flex items-start space-x-2">
                    <i data-lucide="${ic}" class="w-4 h-4 text-ram-burgundy dark:text-ram-gold mt-0.5 shrink-0"></i>
                    <span>${lbl}</span>
                </button>`).join('')}
            </div>
        </div>`;
        }

        function renderMsg(msg) {
            if (msg.role === 'user') {
                return `
            <div class="flex justify-end fade-in">
                <div class="chat-bubble-user px-4 py-2.5 text-sm max-w-[75%]">${escHtml(msg.content)}</div>
            </div>`;
            }
            const badges = (msg.sources || []).map(s => `
            <span class="source-badge ${s.type === 'rag' ? 'source-rag' : 'source-tool'}">
                <i data-lucide="${s.type === 'rag' ? 'book-open' : 'compass'}" style="width:10px;height:10px;"></i>
                ${escHtml(s.title || '')}
            </span>`).join(' ');

            const streamCls = msg.streaming ? 'streaming-cursor' : '';
            return `
        <div class="flex items-start space-x-3 fade-in" id="${msg.id || ''}">
            <div class="w-7 h-7 rounded-full burgundy-gradient text-white flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">AI</div>
            <div class="chat-bubble-ai p-5 text-sm space-y-3 max-w-[82%]">
                <div id="${msg.id ? 'content-' + msg.id : ''}" class="text-gray-700 dark:text-gray-300 leading-relaxed whitespace-pre-wrap ${streamCls}">${fmtMd(msg.content)}</div>
                ${badges ? `<div class="flex flex-wrap gap-1 pt-1">${badges}</div>` : ''}
            </div>
        </div>`;
        }

        function renderLoadingCard() {
            return `
        <div class="flex items-start space-x-3 fade-in" id="loading-card">
            <div class="w-7 h-7 rounded-full burgundy-gradient text-white flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5">AI</div>
            <div class="chat-bubble-ai px-5 py-4 flex items-center space-x-3">
                <div class="flex space-x-1 shrink-0">
                    <div class="w-1.5 h-1.5 rounded-full bg-ram-burgundy" style="animation:phrasePulse 1.2s 0s infinite ease-in-out"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-ram-gold" style="animation:phrasePulse 1.2s 0.2s infinite ease-in-out"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-ram-burgundy" style="animation:phrasePulse 1.2s 0.4s infinite ease-in-out"></div>
                </div>
                <span id="loading-phrase-text" class="text-xs text-gray-400 loading-phrase">${escHtml(state.loadingPhrase)}</span>
            </div>
        </div>`;
        }

        function startLoadingPhrases() {
            let idx = 0;
            state.phraseTimer = setInterval(() => {
                idx = (idx + 1) % LOADING_PHRASES.length;
                state.loadingPhrase = LOADING_PHRASES[idx];
                const el = document.getElementById('loading-phrase-text');
                if (el) el.textContent = state.loadingPhrase;
            }, 2200);
        }
        function stopLoadingPhrases() {
            if (state.phraseTimer) {
                clearInterval(state.phraseTimer);
                state.phraseTimer = null;
            }
        }

        async function sendMsg(text) {
            if (!text || state.isLoading) return;
            state.messages.push({ role: 'user', content: text, sources: [] });
            state.isLoading = true;
            state.loadingPhrase = LOADING_PHRASES[0];
            render();
            startLoadingPhrases();

            const msgId = 'ai-' + Date.now();
            const aiMsg = { id: msgId, role: 'assistant', content: '', sources: [], streaming: true };
            state.messages.push(aiMsg);

            let aiBubbleInserted = false;
            let contentEl = null;

            function ensureAiBubble() {
                if (aiBubbleInserted) return;
                aiBubbleInserted = true;
                stopLoadingPhrases();
                const loadingCard = document.getElementById('loading-card');
                if (loadingCard) loadingCard.remove();

                const chatStream = document.getElementById('chat-stream');
                const bubbleHtml = renderMsg(aiMsg);
                chatStream.insertAdjacentHTML('beforeend', bubbleHtml);
                lucide.createIcons();
                scrollToBottom();
                contentEl = document.getElementById('content-' + msgId);
            }

            try {
                const res = await fetch(API + '/api/chat/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`,
                    },
                    body: JSON.stringify({ message: text, session_id: state.sessionId || null }),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ detail: 'Erreur réseau' }));
                    throw new Error(err.detail || 'Erreur inconnue');
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const raw = line.slice(6).trim();
                        if (!raw) continue;
                        let evt;
                        try { evt = JSON.parse(raw); } catch { continue; }

                        if (evt.type === 'status') {
                            state.loadingPhrase = evt.message;
                            const phraseEl = document.getElementById('loading-phrase-text');
                            if (phraseEl) phraseEl.textContent = evt.message;
                        } else if (evt.type === 'token') {
                            ensureAiBubble();
                            aiMsg.content += evt.value;
                            if (contentEl) {
                                contentEl.innerHTML = fmtMd(aiMsg.content);
                                contentEl.classList.add('streaming-cursor');
                            }
                            scrollToBottom();
                        } else if (evt.type === 'done') {
                            ensureAiBubble();
                            aiMsg.streaming = false;
                            aiMsg.sources = evt.sources || [];
                            if (evt.session_id) {
                                state.sessionId = evt.session_id;
                                localStorage.setItem('ta_session', evt.session_id);
                            }
                            if (contentEl) {
                                contentEl.classList.remove('streaming-cursor');
                                const badges = aiMsg.sources.map(s => `
                                <span class="source-badge ${s.type === 'rag' ? 'source-rag' : 'source-tool'}">
                                    <i data-lucide="${s.type === 'rag' ? 'book-open' : 'compass'}" style="width:10px;height:10px;"></i>
                                    ${escHtml(s.title || '')}
                                </span>`).join(' ');
                                if (badges) {
                                    contentEl.closest('.chat-bubble-ai').insertAdjacentHTML('beforeend',
                                        `<div class="flex flex-wrap gap-1 pt-1">${badges}</div>`);
                                    lucide.createIcons();
                                }
                            }
                        } else if (evt.type === 'error') {
                            ensureAiBubble();
                            aiMsg.content = 'Je rencontre une difficulté temporaire pour traiter cette demande.';
                            aiMsg.streaming = false;
                            if (contentEl) contentEl.classList.remove('streaming-cursor');
                        }
                    }
                }
                await fetchHistory();
            } catch (err) {
                stopLoadingPhrases();
                ensureAiBubble();
                aiMsg.content = `Une difficulté technique est survenue : ${err.message}`;
                aiMsg.streaming = false;
                if (contentEl) contentEl.classList.remove('streaming-cursor');
                showError(err.message);
            } finally {
                state.isLoading = false;
                stopLoadingPhrases();
                const inp = document.getElementById('chat-input');
                const btn = document.querySelector('[onclick="handleSend()"]');
                if (inp) { inp.disabled = false; inp.focus(); }
                if (btn) btn.disabled = false;
            }
        }

        function handleSend() {
            const inp = document.getElementById('chat-input');
            const text = inp?.value?.trim();
            if (!text) return;
            inp.value = '';
            sendMsg(text);
        }

        async function apiReq(method, path, body) {
            const headers = { 'Content-Type': 'application/json' };
            if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
            const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
            if (!res.ok) { const e = await res.json().catch(() => ({ detail: 'Erreur' })); throw new Error(e.detail); }
            return res.json();
        }

        async function handleLogin() {
            const email = document.getElementById('login-email')?.value?.trim();
            const pass = document.getElementById('login-password')?.value;
            if (!email || !pass) { state.loginError = 'Veuillez remplir tous les champs.'; render(); return; }
            const lbl = document.getElementById('login-btn-label');
            if (lbl) lbl.textContent = 'Connexion…';
            try {
                const fd = new FormData();
                fd.append('username', email); fd.append('password', pass);
                const res = await fetch(API + '/api/auth/login', { method: 'POST', body: fd });
                if (!res.ok) { const e = await res.json().catch(() => ({ detail: 'Identifiants incorrects' })); throw new Error(e.detail); }
                const data = await res.json();
                state.token = data.access_token;
                state.user = data.user;
                state.loginError = '';
                localStorage.setItem('ta_token', state.token);
                localStorage.setItem('ta_user', JSON.stringify(state.user));
                state.screen = 'dashboard';
                state.messages = [];
                state.sessionId = null;
                localStorage.removeItem('ta_session');
                await fetchHistory();
                render();
            } catch (err) { state.loginError = err.message; render(); }
        }

        function handleLogout() {
            Object.assign(state, { token: null, user: null, sessionId: null, messages: [], history: [], screen: 'login', loginError: '' });
            ['ta_token', 'ta_user', 'ta_session'].forEach(k => localStorage.removeItem(k));
            render();
        }

        async function fetchHistory() {
            if (!state.token) return;
            try { state.history = (await apiReq('GET', '/api/sessions')).reverse(); }
            catch { state.history = []; }
        }

        async function loadSession(sid) {
            state.sessionId = sid;
            localStorage.setItem('ta_session', sid);
            state.messages = [];
            try {
                const msgs = await apiReq('GET', `/api/chat/history?session_id=${sid}`);
                state.messages = msgs.map(m => ({ role: m.role, content: m.content, sources: [] }));
            } catch { }
            render();
        }

        async function deleteSession(event, sessionId) {
            event.stopPropagation();
            if (!confirm("Voulez-vous vraiment supprimer cette conversation ?")) return;

            try {
                const res = await fetch(API + `/api/sessions/${sessionId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });

                if (!res.ok) throw new Error("Erreur lors de la suppression");

                if (state.sessionId === sessionId) {
                    startNewChat();
                } else {
                    await fetchHistory();
                    render();
                }
            } catch (err) {
                showError("Impossible de supprimer la session.");
            }
        }

        function startNewChat() {
            state.sessionId = null;
            state.messages = [];
            localStorage.removeItem('ta_session');
            render();
        }

        function toggleDark() { state.dark = !state.dark; render(); }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                const el = document.getElementById('chat-stream');
                if (el) el.scrollTop = el.scrollHeight;
            });
        }

        function showError(msg) {
            const t = document.getElementById('error-toast');
            document.getElementById('error-toast-msg').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 4500);
        }

        function escHtml(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function fmtMd(text) {
            return escHtml(text)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        // ══════════════════════════════════════════════════════════════════════════
        // GESTION MICROPHONE AVEC ONDES ET TRANSCRIPTION DANS L'INPUT
        // ══════════════════════════════════════════════════════════════════════════
        let mediaRecorder = null;
        let audioStream = null;
        let recordedChunks = [];

        async function startVoiceRecording() {
            recordedChunks = [];
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mimeType = 'audio/webm';
                if (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                    mimeType = 'audio/webm;codecs=opus';
                }
                mediaRecorder = new MediaRecorder(audioStream, { mimeType });
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.start();

                const inp = document.getElementById('chat-input');
                inp.value = "";
                inp.classList.add('opacity-0');

                document.getElementById('voice-waves-container').classList.remove('hidden');
                document.getElementById('input-actions-normal').classList.add('hidden');
                document.getElementById('input-actions-recording').classList.remove('hidden');

                const actionBtn = document.getElementById('recording-action-btn');
                actionBtn.disabled = false;
                actionBtn.innerHTML = `<i data-lucide="square" class="w-3.5 h-3.5 fill-current"></i>`;

                lucide.createIcons();
            } catch (err) {
                showError("Accès au microphone refusé ou non disponible.");
            }
        }

        function cancelVoiceRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (audioStream) {
                audioStream.getTracks().forEach(t => t.stop());
                audioStream = null;
            }
            document.getElementById('voice-waves-container').classList.add('hidden');
            document.getElementById('input-actions-recording').classList.add('hidden');
            document.getElementById('input-actions-normal').classList.remove('hidden');

            const inp = document.getElementById('chat-input');
            inp.classList.remove('opacity-0');
            inp.placeholder = "Posez votre question (ex : Statut du vol AH1235)...";
            inp.focus();
        }

        async function stopAndTranscribeVoice() {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

            document.getElementById('voice-waves-container').classList.add('hidden');
            const inp = document.getElementById('chat-input');
            inp.classList.remove('opacity-0');
            inp.placeholder = "Transcription en cours...";

            const actionBtn = document.getElementById('recording-action-btn');
            actionBtn.disabled = true;
            actionBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>`;
            lucide.createIcons();

            mediaRecorder.onstop = async () => {
                if (audioStream) {
                    audioStream.getTracks().forEach(t => t.stop());
                    audioStream = null;
                }

                if (recordedChunks.length === 0) {
                    showError("Aucun audio détecté.");
                    cancelVoiceRecording();
                    return;
                }

                const audioBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                const formData = new FormData();
                formData.append('file', audioBlob, 'recording.webm');

                try {
                    const res = await fetch(API + '/api/audio/transcribe', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${state.token}` },
                        body: formData
                    });

                    if (!res.ok) {
                        const err = await res.json().catch(() => ({ detail: 'Erreur serveur' }));
                        throw new Error(err.detail || 'Erreur de transcription');
                    }

                    const data = await res.json();
                    const text = (data.text || '').trim();

                    document.getElementById('input-actions-recording').classList.add('hidden');
                    document.getElementById('input-actions-normal').classList.remove('hidden');

                    inp.placeholder = "Posez votre question (ex : Statut du vol AH1235)...";

                    if (text) {
                        inp.value = text;
                        inp.focus();
                    } else {
                        showError("Aucune parole détectée.");
                    }

                } catch (err) {
                    showError(err.message);
                    cancelVoiceRecording();
                }
            };

            mediaRecorder.stop();
        }

        window.onload = render;
    </script>
</body>
